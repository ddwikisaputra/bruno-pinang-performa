info:
  name: Account Inquiry Internal
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/v2.1/account-inquiry-internal"
  headers:
    - name: X-PARTNER-ID
      value: "{{X-PARTNER-ID}}"
    - name: CHANNEL-ID
      value: APPS1
    - name: X-EXTERNAL-ID
      value: "{{externalId}}"
  body:
    type: json
    data: "{\r

      \    \"beneficiaryAccountNo\": \"033001000001315\"\r

      }"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        var moment = require('moment');
        var externalId = moment().format("YYYYMMDDHHmmss");
        bru.setCollectionVar('externalId', externalId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 2001500 - Successful
    request:
      url: "{{baseUrl}}/snap/v2.0/account-inquiry-internal"
      method: POST
      headers:
        - name: X-PARTNER-ID
          value: "{{X-PARTNER-ID}}"
        - name: CHANNEL-ID
          value: "95231"
        - name: X-EXTERNAL-ID
          value: "{{externalId}}"
        - name: Authorization
          value: Bearer {{token}}
        - name: X-TIMESTAMP
          value: "{{timestamp}}"
        - name: X-SIGNATURE
          value: "{{gen_signature}}"
        - name: Authorization
          value: Bearer {{token}}
      body:
        type: json
        data: "{\r

          \    \"beneficiaryAccountNo\": \"001001000002311\"\r

          }"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Strict-Transport-Security
          value: max-age=31536000; includeSubDomains
        - name: Partnername
          value: GENERAL
        - name: Content-Type
          value: application/json
        - name: Content-Encoding
          value: gzip
        - name: Content-Length
          value: "187"
      body:
        type: json
        data: |-
          {
              "responseCode": "2001500",
              "responseMessage": "Successful",
              "referenceNo": "090725VUY8O",
              "beneficiaryAccountNo": "001001000002311",
              "beneficiaryAccountName": "MANATAR OKSNEL SIAHAAN",
              "beneficiaryAccountStatus": "Rekening Aktif",
              "beneficiaryAccountType": "S",
              "currency": "IDR"
          }
