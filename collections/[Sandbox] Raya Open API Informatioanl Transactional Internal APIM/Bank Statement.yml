info:
  name: Bank Statement
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/v2.0/bank-statement"
  headers:
    - name: X-PARTNER-ID
      value: "{{X-PARTNER-ID}}"
    - name: CHANNEL-ID
      value: APPS1
    - name: X-EXTERNAL-ID
      value: "{{externalId}}"
  body:
    type: json
    data: "{\r

      \    \"accountNo\": \"033001000001315\",\r

      \    \"fromDateTime\": \"2024-05-01T00:01:00Z\",\r

      \    \"toDateTime\": \"2024-05-30T23:59:00Z\",\r

      \    \"additionalInfo\": {\r

      \        \"pageSize\": 1,\r

      \        \"pageNumber\": 3\r

      \    }\r

      }"
  auth:
    type: bearer
    token: aksda

runtime:
  scripts:
    - type: before-request
      code: |-
        var moment = require('moment');
        var externalId = moment().format("YYYYMMDDHHmmss");
        bru.setCollectionVar('externalId', externalId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
