        - name: CHANNEL-ID
          value: "95231"
        - name: X-EXTERNAL-ID
          value: "{{externalId}}"
        - name: Authorization
          value: Bearer {{token}}
        - name: X-TIMESTAMP
          value: "{{timestamp}}"
        - name: X-SIGNATURE
          value: "{{gen_signature}}"
      body:
        type: json
        data: "{\r

          \    \"accountNo\": \"001001000060300\",\r

