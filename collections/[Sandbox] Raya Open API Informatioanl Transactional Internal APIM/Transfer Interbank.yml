info:
  name: Transfer Interbank
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/v2.1/transfer-interbank"
  headers:
    - name: X-PARTNER-ID
      value: "{{X-PARTNER-ID}}"
    - name: CHANNEL-ID
      value: "95231"
    - name: X-EXTERNAL-ID
      value: "{{externalId}}"
  body:
    type: json
    data: "{\r

      \  \"partnerReferenceNo\": \"2026082600001\",\r

      \  \"amount\": {\r

      \    \"value\": \"50000000.00\",\r

      \    \"currency\": \"IDR\"\r

      \  },\r

      \  \"beneficiaryAccountName\": \"RUBY IHSAN\",\r

      \  \"beneficiaryAccountNo\": \"001001001131\",\r

      \  \"beneficiaryBankCode\": \"BRINIDJA\",\r

      \  \"beneficiaryBankName\": \"Bank BRI\",\r

      \  \"customerReference\": \"260826LJX3S\",\r

      \  \"sourceAccountNo\": \"001001000024401\",\r

      \  \"transactionDate\": \"2026-08-26T09:33:00+07:00\",\r

      \  \"feeType\": \"OUR\",\r

      \  \"originatorInfos\": {\r

      \    \"originatorCustomerNo\": \"001001000024401\",\r

      \    \"originatorCustomerName\": \"Andhika Pro\",\r

      \    \"originatorBankCode\": \"002\"\r

      \  },\r

      \  \"additionalInfo\": {\r

      \    \"switcher\": \"RTOL\"\r

      \  }\r

      }\r\n"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        var moment = require('moment');
        var externalId = moment().format("YYYYMMDDHHmmss");
        bru.setCollectionVar('externalId', externalId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

