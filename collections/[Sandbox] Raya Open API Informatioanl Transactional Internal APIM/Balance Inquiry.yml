info:
  name: Balance Inquiry
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v2.0/balance-inquiry"
  headers:
    - name: X-PARTNER-ID
      value: "{{X-PARTNER-ID}}"
    - name: CHANNEL-ID
      value: APPS1
    - name: X-EXTERNAL-ID
      value: "{{externalId}}"
  body:
    type: json
    data: "{\r

      \    \"accountNo\": \"001001008668315\"\r

      }"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        var moment = require('moment');
        var externalId = moment().format("YYYYMMDDHHmmss");
        bru.setCollectionVar('externalId', externalId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 2001100 - Successful
    request:
      url: "{{baseUrl}}/snap/v2.0/balance-inquiry"
      method: POST
      headers:
        - name: X-PARTNER-ID
          value: "{{X-PARTNER-ID}}"
        - name: CHANNEL-ID
          value: "95231"
        - name: X-EXTERNAL-ID
          value: "{{externalId}}"
        - name: Authorization
          value: Bearer {{token}}
        - name: X-TIMESTAMP
          value: "{{timestamp}}"
        - name: X-SIGNATURE
          value: "{{gen_signature}}"
      body:
        type: json
        data: "{\r

          \    \"accountNo\": \"001001000060300\"\r

          }"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Strict-Transport-Security
          value: max-age=31536000; includeSubDomains
        - name: Partnername
          value: GENERAL
        - name: Content-Type
          value: application/json
        - name: Content-Encoding
          value: gzip
        - name: Content-Length
          value: "243"
      body:
        type: json
        data: |-
          {
              "responseCode": "2001100",
              "responseMessage": "Successful",
              "accountNo": "001001000001403",
              "name": "AROMA MEGA SARI PT",
              "accountInfos": [
                  {
                      "holdAmount": {
                          "value": "1.00",
                          "currency": "IDR"
                      },
                      "availableBalance": {
                          "value": "131638053.90",
                          "currency": "IDR"
                      },
                      "ledgerBalance": {
                          "value": "131638054.90",
                          "currency": "IDR"
                      },
                      "status": "0001"
