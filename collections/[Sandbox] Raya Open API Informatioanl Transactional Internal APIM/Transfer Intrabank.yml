info:
  name: Transfer Intrabank
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/v2.1/transfer-intrabank"
  headers:
    - name: X-PARTNER-ID
      value: "{{X-PARTNER-ID}}"
    - name: CHANNEL-ID
      value: APPS1
    - name: X-EXTERNAL-ID
      value: "{{externalId}}"
  body:
    type: json
    data: "{\r

      \    \"partnerReferenceNo\": \"2026082600000000001\",\r

      \    \"amount\": {\r

      \        \"value\": \"50000000.00\",\r

      \        \"currency\": \"IDR\"\r

      \    },\r

      \    \"beneficiaryAccountNo\": \"033001000001315\",\r

      \    \"customerReference\": \"260826B8DLU\",\r

      \    \"remark\": \"OATRFINTRA TESTING HUNTER\",\r

      \    \"sourceAccountNo\": \"001001000024401\",\r

      \    \"transactionDate\": \"2026-08-26T09:44:00+07:00\",\r

      \    \"originatorInfos\": {\r

      \        \"originatorCustomerNo\": \"081235123582\",\r

      \        \"originatorCustomerName\": \"XXXXX\",\r

      \        \"originatorBankCode\": \"002\"\r

      \    }\r

      }"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        var moment = require('moment');
        var externalId = moment().format("YYYYMMDDHHmmss");
        bru.setCollectionVar('externalId', externalId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

