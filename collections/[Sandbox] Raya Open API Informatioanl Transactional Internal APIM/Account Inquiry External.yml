info:
  name: Account Inquiry External
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/v2.1/account-inquiry-external"
  headers:
    - name: X-PARTNER-ID
      value: "{{X-PARTNER-ID}}"
    - name: CHANNEL-ID
      value: "95231"
    - name: X-EXTERNAL-ID
      value: "{{externalId}}"
    - name: X-TIMESTAMP
      value: "{{timestamp}}"
    - name: X-SIGNATURE
      value: "{{gen_signature}}"
  body:
    type: json
    data: |-
      {
          "beneficiaryBankCode": "BRINIDJA",
          "beneficiaryAccountNo": "001001001131",
          "additionalInfo": {
              "switcher": "RTOL",
              "sourceAccountNo": "001001000024401"
          }
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        var moment = require('moment');
        var externalId = moment().format("YYYYMMDDHHmmss");
        bru.setCollectionVar('externalId', externalId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 2001600 - Successful (BIFAST)
    request:
      url: "{{baseUrl}}/snap/v2.0/account-inquiry-external"
      method: POST
      headers:
        - name: X-PARTNER-ID
          value: UATP001
        - name: CHANNEL-ID
          value: "95231"
        - name: X-EXTERNAL-ID
          value: "{{externalId}}"
        - name: Authorization
          value: Bearer {{token}}
        - name: X-TIMESTAMP
          value: "{{timestamp}}"
        - name: X-SIGNATURE
          value: "{{gen_signature}}"
      body:
        type: json
        data: '{"beneficiaryBankCode":"BMRIIDJA","beneficiaryAccountNo":"2600000129028","additionalInfo":{"switcher":"BIFAST"}}'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Strict-Transport-Security
          value: max-age=31536000; includeSubDomains
        - name: Partnername
          value: GENERAL
        - name: Content-Type
          value: application/json
        - name: Content-Encoding
          value: gzip
        - name: Content-Length
          value: "214"
      body:
        type: json
        data: |-
          {
              "responseCode": "2001600",
              "responseMessage": "Successful",
              "referenceNo": "241125TITS3",
              "beneficiaryAccountNo": "2600000129028",
              "beneficiaryAccountName": "Andhika Pro",
              "beneficiaryBankCode": "BMRIIDJA",
              "beneficiaryBankName": "Bank Mandiri",
              "currency": "IDR",
              "additionalInfo": {
                  "switcher": "BIFAST"
              }
          }
