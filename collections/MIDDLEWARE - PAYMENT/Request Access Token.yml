info:
  name: Request Access Token
  type: http
  seq: 3

http:
  method: POST
  url: "{{base-url-sandbox}}/snap/{{version-1}}/access-token/b2b"
  headers:
    - name: X-SIGNATURE
      value: "{{X-SIGNATURE}}"
    - name: X-TIMESTAMP
      value: "{{X-TIMESTAMP}}"
    - name: X-CLIENT-KEY
      value: "{{client-id-sandbox}}"
  body:
    type: json
    data: |-
      {
        "grantType": "client_credentials"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var jsonData = res.getBody();
        if (jsonData.responseCode != "2007300"){
          console.log("error : ", jsonData.responseCode)
          return
        }
        bru.setEnvVar("ACCESS-TOKEN-RAYA-OPENAPI", jsonData.accessToken)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
