  url: "{{base-url-local}}/v/1/ekyc/cashloan/cek-ocr"
  headers:
    - name: Api-Key
      value: "{{apiKeyMerchant}}"
  body:
    type: form-urlencoded
    data:
      - name: nomorIdentitas
        value: MzIwOTEyMjAwMzk0MDAwNg==
        description: Nomor Identitas User [MANDATORY] [Base64]
      - name: kodePartnership
        value: TUox
        description: Kode Partnership [MANDATORY] [Base64]

auth:
  type: bearer
  token: "{{tokenMerchant}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

