info:
  name: Detail Monitoring Pinjaman (MF)
  type: http
  seq: 6

http:
  method: POST
  url: "{{base-url-local}}/v/1/partnership/mf/detail-monitoring-pinjaman"
  headers:
    - name: Api-Key
      value: "{{apiKeyMerchant}}"
  body:
    type: form-urlencoded
    data:
      - name: kodePencairan
        value: RVgtTUoxLTIwMjYwMDAwMDE=
        description: Kode Pencairan [MANDATORY] [Base64]
  auth:
    type: bearer
    token: "{{tokenMerchant}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
