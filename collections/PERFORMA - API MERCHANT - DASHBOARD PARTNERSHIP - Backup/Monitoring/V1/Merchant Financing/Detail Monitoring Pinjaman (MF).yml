info:
  name: Detail Monitoring Pinjaman (MF)
  type: http
  seq: 2

http:
  method: POST
  url: "{{base-url-local}}/v/1/partnership/mf/detail-monitoring-pinjaman"
  headers:
    - name: Api-Key
      value: "{{apiKeyDev}}"
  body:
    type: form-urlencoded
    data:
      - name: kodePencairan
        value: ""
        description: Kode Pencairan [MANDATORY][BASE64 STRING]
  auth:
    type: bearer
    token: "{{accessTokenPartner}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 503 - Service Unavailable
    request:
      url: "{{base-url-local}}/v/1/partnership/mf/detail-monitoring-pinjaman"
      method: POST
      headers:
        - name: Api-Key
          value: "{{apiKeyDev}}"
      body:
        type: form-urlencoded
        data:
          - name: kodePencairan
            value: ""
            description: Kode Pencairan [MANDATORY][BASE64 STRING]
    response:
      status: 503
      statusText: Service Unavailable
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
        - name: Date
          value: Wed, 03 Apr 2024 10:28:45 GMT
        - name: Content-Length
          value: "67"
      body:
        type: json
        data: |-
          {
              "message": "Jam operasional Pinang Performa dari jam XX.XX - XX.XX WIB setiap hari. Kembali lagi nanti, ya!",
