info:
  name: List Monitoring Pinjaman (CL)
  type: http
  seq: 3

http:
  method: POST
  url: "{{base-url-local}}/v/1/partnership/cl/list-monitoring-pinjaman"
  headers:
    - name: Api-Key
      value: "{{apiKeyDev}}"
  body:
    type: form-urlencoded
    data:
      - name: startIndex
        value: "0"
        description: Start Index [OPTIONAL][NUMBER]
      - name: recordCount
        value: "10"
        description: Record Count [OPTIONAL][NUMBER]
      - name: sortBy
        value: "due_date desc"
        description: Sort By [OPTIONAL][STRING][name asc|desc, nominal asc|desc, due_date asc|desc]
      - name: filterStatus
        value: "-1"
        description: Filter Status [OPTIONAL][INT][-1=All Kecuali Lunas | 1=Aktif | 2=Lunas | 3=H-. . Jatuh Tempo | 4=Jatuh Tempo | 5=Telat . . Hari | 6=Biaya Admin Belum Terbayar]
      - name: textSearch
        value: ""
        description: Text Search [OPTIONAL][STRING]
  auth:
    type: bearer
    token: "{{accessTokenPartner}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

