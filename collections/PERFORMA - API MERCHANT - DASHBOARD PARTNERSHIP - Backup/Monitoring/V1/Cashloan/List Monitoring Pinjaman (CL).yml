info:
  name: List Monitoring Pinjaman (CL)
  type: http
  seq: 5

http:
  method: POST
  url: "{{base-url-local}}/v/1/partnership/cl/list-monitoring-pinjaman"
  headers:
    - name: Api-Key
      value: "{{apiKeyMerchant}}"
  body:
    type: form-urlencoded
    data:
      - name: startIndex
        value: "0"
        description: Start Index [OPTIONAL]
      - name: recordCount
        value: "10"
        description: Record Count [OPTIONAL]
      - name: sortBy
        value: due_date desc
        description: Sort By [OPTIONAL] [oneof] 'name asc' | 'name desc' | 'nominal asc' | 'nominal desc' | 'due_date asc' | 'due_date desc'
      - name: filterStatus
        value: All
        description: Filter Status [OPTIONAL] [oneof] 'All' | 'Aktif' | 'Lunas' | 'Sebelum Jatuh Tempo' | 'Jatuh Tempo' | 'Lewat Jatuh Tempo' | 'Biaya Admin Belum Terbayar'
      - name: textSearch
        value: ""
        description: Text Search [OPTIONAL]
  auth:
    type: bearer
    token: "{{tokenMerchant}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

