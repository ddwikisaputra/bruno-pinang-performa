info:
  name: Verifikasi QR
  type: http
  seq: 9

http:
  method: POST
  url: "{{base-url-local}}/v/1/pencairan/verifikasi-qr"
  headers:
    - name: Api-Key
      value: "{{apiKeyMerchant}}"
  body:
    type: form-urlencoded
    data:
      - name: kodePartnership
        value: TUox
        description: Kode Partnership [MANDATORY] [Base64]
      - name: dataParams
        value: UExBQ0VIT0xERVItR0NNLUNJUEhFUlRFWFQtVjE=
        description: Data Params [MANDATORY] [GCM Encode] - nilai = field "data" dari response Generate QR (AES/GCM), berisi {"qrCode":<Base64 Numeric>,"kodePrakarsa":<Base64>} (nilai placeholder - perlu capture dari Generate QR)
      - name: nominal
        value: MTAwMDAwMA==
        description: Nominal [MANDATORY] [Base64] [Angka Desimal]
      - name: nomorInvoice
        value: SU5WLTAwMQ==
        description: Nomor Invoice [MANDATORY] [Base64]
      - name: tenor
        value: Ng==
        description: Tenor [OPTIONAL] [Base64] [Angka]
        disabled: true
  auth:
    type: bearer
    token: "{{tokenMerchant}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

