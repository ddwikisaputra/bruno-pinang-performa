info:
  name: Verifikasi Status QR
  type: http
  seq: 10

http:
  method: POST
  url: "{{base-url-local}}/v/1/pencairan/verifikasi-status-qr"
  headers:
    - name: Api-Key
      value: "{{apiKeyMerchant}}"
  body:
    type: form-urlencoded
    data:
      - name: kodePrakarsa
        value: RVgtTUoxLVVtRjVZVkJwVUdWeVZHOXcvbHg2bkdUNGxVWnFLV2FQSE80NzNwZGZGSmprYWFrN2lkR2NuRTdkRjB0WXIzTi9NQVV1eTZ1RWluM2JSRXc9
        description: Kode Prakarsa [MANDATORY] [Base64] (express_prakarsa.references.id)
      - name: kodePartnership
        value: TUox
        description: Kode Partnership [MANDATORY] [Base64]
      - name: kodeQR
        value: "20260805120405000001"
        description: Kode QR [MANDATORY] [Numeric] (qr_disbursement.qr_code - nilai placeholder, perlu nilai QR asli)
  auth:
    type: bearer
    token: "{{tokenMerchant}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

