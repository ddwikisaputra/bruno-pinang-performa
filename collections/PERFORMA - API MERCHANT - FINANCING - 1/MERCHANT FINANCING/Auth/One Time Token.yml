info:
  name: One Time Token
  type: http
  seq: 1

http:
  method: POST
  url: "{{base-url-local}}/v/1/request-onetime-token"
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
    - name: Api-Key
      value: UmF5YVBpUGVyVG9wgCd8ydJrVKF9iYxounlkwQWdGw==
      description: Harus cocok dengan kolom api_key pada tabel partnerships.
  body:
    type: form-urlencoded
    data:
      - name: usernam
        value: MJ1
        description: Harus cocok dengan kolom code pada tabel partnerships DAN kolom username pada tabel api_access_authentication.
      - name: password
        value: performa
        description: "\tHarus cocok dengan kolom password pada tabel api_access_authentication."
      - name: params
        value: cif=123456&loan_id=789
        description: Bebas string parameter apa saja
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: success - Request One Time Token
    request:
      url: "{{base-url-local}}/v/1/request-onetime-token"
      method: POST
      headers:
        - name: Content-Type
          value: application/x-www-form-urlencoded
        - name: Api-Key
          value: UmF5YVBpUGVyVG9wgCd8ydJrVKF9iYxounlkwQWdGw==
          description: Harus cocok dengan kolom api_key pada tabel partnerships.
      body:
        type: form-urlencoded
        data:
          - name: username
            value: MJ1
            description: Harus cocok dengan kolom code pada tabel partnerships DAN kolom username pada tabel api_access_authentication.
          - name: password
            value: performa
            description: "\tHarus cocok dengan kolom password pada tabel api_access_authentication."
          - name: params
            value: cif=123456&loan_id=789
            description: Bebas string parameter apa saja
    response:
      status: 200
      statusText: OK
      headers:
        - name: cache-control
          value: none
        - name: content-security-policy
          value: script-src 'self' pinang-performa.bankraya.co.id
        - name: content-type
          value: application/json; charset=utf-8
        - name: permissions-policy
