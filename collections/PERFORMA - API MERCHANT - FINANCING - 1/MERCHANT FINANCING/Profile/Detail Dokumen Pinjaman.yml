info:
  name: Detail Dokumen Pinjaman
  type: http
  seq: 3

http:
  method: POST
  url: "{{base-url-local}}/v/1/profile/detail-dokumen-pinjaman"
  headers:
    - name: Api-Key
      value: VW1GNVlWQnBVR1Z5Vkc5d2dDZDh5ZEpyVktGOWlZeG91bmxrd1FXZEd3PT0=
  body:
    type: form-urlencoded
    data:
      - name: kodePrakarsa
        value: RVgtTUoxLVVtRjVZVkJwVUdWeVZHOXcvbHQ5bm1iMWtrRnJMMitLSE80NzJKZGZGSmpnYUtFN2lkQ2Ruay9iRmpVOGFmU0lRbkdRYUltaEh5dEUxNnM9
        description: Nomor Identitas [MANDATORY][BASE64 STRING]
      - name: kodePartnership
        value: TUox
        description: Kode Partnership [MANDATORY] [Base64]
      - name: tipeDokumen
        value: surat-peringatan
        description: "{MANDATORY} [surat-lunas | surat-peringatan | surat-pk]"
      - name: idDokumen
        value: "2"
        description: "{MANDATORY}"
  auth:
    type: bearer
    token: "{{tokenMerchant}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

