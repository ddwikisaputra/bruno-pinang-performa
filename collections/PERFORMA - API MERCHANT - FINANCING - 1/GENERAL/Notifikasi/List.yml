info:
  name: List
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:7008/v/1/notifikasi/list
  headers:
    - name: Api-Key
      value: "{{apiKeyMerchant}}}"
  body:
    type: form-urlencoded
    data:
      - name: kodePartnership
        value: TUox
      - name: nomorIdentitas
        value: MzI3NjA5MTcxMTAwMDEzNg==
      - name: recordCount
        value: "10"
      - name: startIndex
        value: "0"
      - name: orderText
        value: action_date DESC
  auth:
    type: bearer
    token: "{{tokenMerchant}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
