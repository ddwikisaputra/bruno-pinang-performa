info:
  name: List
  type: http
  seq: 2

http:
  method: POST
  url: "[::1]:7008/v/1/notifikasi/list"
  headers:
    - name: Api-Key
      value: "{{apiKeyMerchant}}"
  body:
    type: form-urlencoded
    data:
      - name: kodePartnership
        value: ""
        description: "[MANDATORY] [BASE64]"
      - name: nomorIdentitas
        value: ""
        description: "[MANDATORY] [BASE64]"
      - name: recordCount
        value: ""
        description: "[OPTIONAL] [Default 10]"
      - name: startIndex
        value: "0"
        description: "[OPTIONAL] [Default 0]"
        disabled: true
      - name: orderText
        value: action_date DESC
        description: "[OPTIONAL] [Default id DESC] [action_date ASC | id ASC | action_date DESC | id DESC]"
        disabled: true
  auth:
    type: bearer
    token: "{{tokenMerchant}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

