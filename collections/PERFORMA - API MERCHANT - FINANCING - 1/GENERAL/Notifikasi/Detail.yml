info:
  name: Detail
  type: http
  seq: 3

http:
  method: POST
  url: "[::1]:7008/v/1/notifikasi/detail"
  headers:
    - name: Api-Key
      value: "{{apiKeyMerchant}}"
  body:
    type: form-urlencoded
    data:
      - name: kodePartnership
        value: TUox
      - name: nomorIdentitas
        value: MzI3NjA5MTcxMTAwMDEzNg==
      - name: kodeNotifikasi
        value: OTU=
  auth:
    type: bearer
    token: "{{tokenMerchant}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

