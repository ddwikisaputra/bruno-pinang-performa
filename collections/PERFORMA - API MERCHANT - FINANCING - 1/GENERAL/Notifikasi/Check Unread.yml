info:
  name: Check Unread
  type: http
  seq: 1

http:
  method: POST
  url: "[::1]:7008/v/1/notifikasi/check-unread"
  headers:
    - name: Api-Key
      value: "{{apiKeyMerchant}}"
  body:
    type: form-urlencoded
    data:
      - name: kodePartnership
        value: TUox
        description: "[MANDATORY] [BASE64]"
      - name: nomorIdentitas
        value: MzI3NjA5MTcxMTAwMDEzNg==
        description: "[MANDATORY] [BASE64]"
  auth:
    type: bearer
    token: "{{tokenMerchant}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 503 - Service Unavailable
    request:
      url: "{{base-url-dev}}/v/1/notifikasi/check-unread"
      method: POST
      headers:
        - name: Api-Key
          value: "{{apiKeyMerchant}}"
      body:
        type: form-urlencoded
        data:
          - name: kodePartnership
            value: TUox
          - name: nomorIdentitas
            value: MzI3NjA5MTcxMTAwMDEzNg==
    response:
      status: 503
      statusText: Service Unavailable
      body:
        type: text
        data: |-
          {
            "message": "Jam operasional Pinang Performa dari jam xx:xx - xx:xx WIB setiap hari. Kembali lagi nanti, ya!",
            "status": 503
          }
